# Vhost do Nginx do Laragon para https://uysiarbo.local, como proxy reverso do servidor Go.
# Instalação (no PC de desenvolvimento):
#   1. Laragon > Menu > Preferências > Serviços e portas: servidor Web = Nginx (porta 80 e SSL 443).
#      O Apache não pode estar ocupando essas portas.
#   2. Apague C:\laragon\etc\nginx\sites-enabled\auto.uysiarbo.local.conf (é o modelo PHP gerado
#      pelo Laragon) e salve este arquivo ali como "uysiarbo.local.conf", sem o prefixo "auto.".
#   3. No arquivo hosts (como administrador), uma linha por nome: 127.0.0.1 uysiarbo.local e
#      127.0.0.1 <subdominio>.uysiarbo.local para cada cliente (ex.: 127.0.0.1 uysiarbonm.uysiarbo.local);
#      o certificado do Laragon cobre *.uysiarbo.local, por isso o cliente fica sob uysiarbo.local
#   4. Suba o servidor Go (porta APP_ADDR, padrão :8090) e recarregue o Nginx pelo Laragon.
server {
    listen 80;
    listen 443 ssl;
    # Console em uysiarbo.local; cada cliente em <subdominio>.local (precisa de uma linha no hosts).
    # O regex só vale para nomes sem vhost próprio no Laragon (nome exato sempre tem prioridade).
    server_name uysiarbo.local ~^[a-z0-9-]+\.uysiarbo\.local$;

    ssl_certificate "C:/laragon/etc/ssl/laragon.crt";
    ssl_certificate_key "C:/laragon/etc/ssl/laragon.key";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
