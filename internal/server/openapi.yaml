openapi: 3.0.3
info:
  title: UYSI ARBO — API para sistemas externos
  version: "1.0.0"
  description: |
    API de leitura e gravação do UYSI ARBO. Cada cliente (prefeitura) tem a sua, no próprio endereço:
    `https://<subdominio-do-cliente>/api/v1/...`.

    **Autenticação** (OAuth2, *client credentials*): crie uma credencial em *Administração → API e integrações*,
    troque `client_id` e `client_secret` por um token em `POST /api/v1/token` e envie o token em
    `Authorization: Bearer <token>`. O token vale 15 minutos. Desativar a credencial ou trocar o segredo
    invalida os tokens já emitidos.

    **Escopos:** `recurso:read` e `recurso:write` (por exemplo, `cidades:read`). Gravar não dá direito de ler.

    **Erros:** sempre `{"error": {"code": "...", "message": "...", "request_id": "..."}}`.

    **Gravações:** envie `Idempotency-Key` (até 64 caracteres) para repetir um pedido sem duplicar; a mesma
    chave com o mesmo pedido devolve a resposta guardada (cabeçalho `Idempotent-Replayed: true`) por 24 horas.

    **Listas:** paginação por cursor (`limit` até 200 e `cursor` = `next_cursor` da resposta anterior).

    **Limite de uso:** 120 chamadas por minuto por credencial (ajustável). Ao exceder: `429` e `Retry-After`.
servers:
  - url: https://{subdominio}.inovarsistemas.biz/api/v1
    variables:
      subdominio:
        default: uysiarbonm
security:
  - bearer: []
paths:
  /token:
    post:
      summary: Troca client_id e client_secret por um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string, description: "Ou use HTTP Basic." }
                client_secret: { type: string }
                scope: { type: string, description: "Escopos desejados, separados por espaço (padrão: todos os da credencial)." }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
                  scope: { type: string, example: "cidades:read cidades:write" }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /cidades:
    get:
      summary: Lista as cidades
      description: "Escopo: `cidades:read`."
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de cidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Cidade" }
                  next_cursor:
                    type: string
                    nullable: true
        "401": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
    post:
      summary: Cria uma cidade
      description: "Escopo: `cidades:write`."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CidadeNova" }
      responses:
        "201":
          description: Criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /cidades/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Busca uma cidade
      description: "Escopo: `cidades:read`."
      responses:
        "200":
          description: A cidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Altera campos de uma cidade
      description: "Escopo: `cidades:write`. Só os campos enviados mudam."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CidadeAlteracao" }
      responses:
        "200":
          description: A cidade alterada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]+$" }
      description: Repete o pedido sem duplicar (válida por 24 horas).
  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: validation_error }
                  message: { type: string }
                  request_id: { type: string }
  schemas:
    Cidade:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        uf: { type: string, example: MT }
        ibge: { type: string, example: "5106240" }
        ativo: { type: boolean }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    CidadeNova:
      type: object
      required: [nome, uf]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 2, maxLength: 100 }
        uf: { type: string, example: MT }
        ibge: { type: string, pattern: "^[0-9]{0,7}$" }
        ativo: { type: boolean, default: true }
    CidadeAlteracao:
      type: object
      additionalProperties: false
      properties:
        nome: { type: string }
        uf: { type: string }
        ibge: { type: string }
        ativo: { type: boolean }
