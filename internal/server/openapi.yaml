openapi: 3.0.3
info:
  title: UYSI ARBO — API para sistemas externos
  version: "1.2.0"
  description: |
    API de leitura e gravação do UYSI ARBO. Cada cliente (prefeitura) tem a sua, no próprio endereço:
    `https://<subdominio-do-cliente>/api/v1/...`.

    **Autenticação** (OAuth2, *client credentials*): crie uma credencial em *Administração → API e integrações*,
    troque `client_id` e `client_secret` por um token em `POST /api/v1/token` e envie o token em
    `Authorization: Bearer <token>`. O token vale 15 minutos. Desativar a credencial ou trocar o segredo
    invalida os tokens já emitidos.

    **Escopos:** `recurso:read` e `recurso:write` (por exemplo, `cidades:read`). Gravar não dá direito de ler.

    **Erros:** sempre `{"error": {"code": "...", "message": "...", "request_id": "..."}}`.

    **Gravações:** envie `Idempotency-Key` (até 64 caracteres) para repetir um pedido sem duplicar; a mesma
    chave com o mesmo pedido devolve a resposta guardada (cabeçalho `Idempotent-Replayed: true`) por 24 horas.

    **Listas:** paginação por cursor (`limit` até 200 e `cursor` = `next_cursor` da resposta anterior).

    **IDs gerados no aplicativo:** nas criações de bairros, quarteirões e locais envie o seu próprio identificador em
    `id_externo` (até 64 caracteres, único por tipo de registro). Reenviar o mesmo `id_externo` devolve o registro que já
    existe (`200`) em vez de duplicar. Para sincronizar, peça só o que mudou com `updated_since`; desativados continuam na lista
    (`ativo: false`), nada é apagado.

    **Limite de uso:** 120 chamadas por minuto por credencial (ajustável). Ao exceder: `429` e `Retry-After`.
servers:
  - url: https://{subdominio}.inovarsistemas.biz/api/v1
    variables:
      subdominio:
        default: uysiarbonm
security:
  - bearer: []
paths:
  /token:
    post:
      summary: Troca client_id e client_secret por um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string, description: "Ou use HTTP Basic." }
                client_secret: { type: string }
                scope: { type: string, description: "Escopos desejados, separados por espaço (padrão: todos os da credencial)." }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
                  scope: { type: string, example: "cidades:read cidades:write" }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /cidades:
    get:
      summary: Lista as cidades
      description: "Escopo: `cidades:read`."
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de cidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Cidade" }
                  next_cursor:
                    type: string
                    nullable: true
        "401": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
    post:
      summary: Cria uma cidade
      description: "Escopo: `cidades:write`."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CidadeNova" }
      responses:
        "201":
          description: Criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /cidades/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Busca uma cidade
      description: "Escopo: `cidades:read`."
      responses:
        "200":
          description: A cidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Altera campos de uma cidade
      description: "Escopo: `cidades:write`. Só os campos enviados mudam."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CidadeAlteracao" }
      responses:
        "200":
          description: A cidade alterada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cidade" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /bairros:
    get:
      summary: Lista os bairros
      description: |
        Escopo: `bairros:read`. Filtros: `updated_since` (RFC 3339, só o que mudou desde então, para sincronizar), `id_externo`, `cidade_id`, `status` (ativo ou extinto) e `q` (parte do nome).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: id_externo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Bairro" }
                  next_cursor:
                    type: string
                    nullable: true
        "400": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
    post:
      summary: Cria (ou devolve, se o `id_externo` já existir)
      description: |
        Escopo: `bairros:write`. Se o `id_externo` já estiver cadastrado, responde `200` com o registro que existe, sem criar nada:
        o aplicativo pode reenviar com segurança. Campos: `cidade_id`, `nome`, `categoria` (bairro|povoado), `classificacao` (urbano|rural), `status` (ativo|extinto), `ibge`, `zona`, `mutirao`, `producao`, `latitude`, `longitude`, `altitude`, `distancia_centro`, `id_externo`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Já existia (mesmo `id_externo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bairro" }
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bairro" }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /bairros/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Busca por id
      description: "Escopo: `bairros:read`."
      responses:
        "200":
          description: O registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bairro" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Altera só os campos enviados
      description: "Escopo: `bairros:write`. `null` limpa um campo opcional. O `id_externo` pode ser definido uma vez e não muda depois."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: O registro alterado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bairro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /quarteiroes:
    get:
      summary: Lista os quarteirões
      description: |
        Escopo: `quarteiroes:read`. Filtros: `updated_since` (RFC 3339, só o que mudou desde então, para sincronizar), `id_externo`, `bairro_id` e `ativo`.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: id_externo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Quarteirao" }
                  next_cursor:
                    type: string
                    nullable: true
        "400": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
    post:
      summary: Cria (ou devolve, se o `id_externo` já existir)
      description: |
        Escopo: `quarteiroes:write`. Se o `id_externo` já estiver cadastrado, responde `200` com o registro que existe, sem criar nada:
        o aplicativo pode reenviar com segurança. Campos: `bairro_id` (só na criação), `nome`, `ativo`, `id_externo`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Já existia (mesmo `id_externo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quarteirao" }
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quarteirao" }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /quarteiroes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Busca por id
      description: "Escopo: `quarteiroes:read`."
      responses:
        "200":
          description: O registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quarteirao" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Altera só os campos enviados
      description: "Escopo: `quarteiroes:write`. `null` limpa um campo opcional. O `id_externo` pode ser definido uma vez e não muda depois."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: O registro alterado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quarteirao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /locais:
    get:
      summary: Lista os locais
      description: |
        Escopo: `locais:read`. Filtros: `updated_since` (RFC 3339, só o que mudou desde então, para sincronizar), `id_externo`, `bairro_id`, `quarteirao_id`, `tipo`, `ativo` e `q` (endereço ou número).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: id_externo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Local" }
                  next_cursor:
                    type: string
                    nullable: true
        "400": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
    post:
      summary: Cria (ou devolve, se o `id_externo` já existir)
      description: |
        Escopo: `locais:write`. Se o `id_externo` já estiver cadastrado, responde `200` com o registro que existe, sem criar nada:
        o aplicativo pode reenviar com segurança. Campos: `tipo` (residencial|comercio|terreno_baldio|ponto_estrategico|outro), `cep`, `endereco`, `numero`, `referencia`, `bairro_id`, `quarteirao_id`, `lado`, `sequencia`, `complemento`, `latitude`, `longitude`, `proprietario`, `proprietario_telefone`, `proprietario_whatsapp`, `proprietario_email`, `aceita_whatsapp`, `aceita_email`, `inquilino`, `inquilino_telefone`, `humanos`, `cachorros`, `gatos`, `roedores`, `ativo`, `id_externo`. O CPF do proprietário não passa pela API.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Já existia (mesmo `id_externo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Local" }
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Local" }
        "400": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /locais/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Busca por id
      description: "Escopo: `locais:read`."
      responses:
        "200":
          description: O registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Local" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Altera só os campos enviados
      description: "Escopo: `locais:write`. `null` limpa um campo opcional. O `id_externo` pode ser definido uma vez e não muda depois."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: O registro alterado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Local" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /importacoes:
    post:
      summary: Envia linhas para importar (análise com prévia, sem gravar)
      description: |
        Escopos: `importacoes:write` e o escopo de gravação do tipo (por exemplo, `locais:write`). As linhas passam pela mesma análise
        das telas de Importação de dados: cada linha vira **criar**, **atualizar**, **ignorar** ou **erro**, e nada é gravado até
        `POST /importacoes/{id}/executar`. Cada linha é um objeto cujas chaves são os nomes das colunas do modelo de importação
        (por exemplo, para bairros: `cidade`, `nome`, `zona`, `id_externo`...); bairros, quarteirões e locais na ordem bairros, quarteirões, locais.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, linhas]
              additionalProperties: false
              properties:
                tipo: { type: string, enum: [bairros, quarteiroes, locais] }
                atualizar_existentes: { type: boolean, default: false, description: "Se verdadeiro, altera os registros que já existem (só com o que vier preenchido)." }
                linhas:
                  type: array
                  maxItems: 20000
                  items: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Análise pronta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Importacao" }
        "400": { $ref: "#/components/responses/Erro" }
        "403": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /importacoes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Situação da importação (prévia e andamento)
      description: "Escopo: `importacoes:read`."
      responses:
        "200":
          description: A importação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Importacao" }
        "404": { $ref: "#/components/responses/Erro" }
  /importacoes/{id}/linhas:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Linhas da importação, com a análise e o resultado de cada uma
      description: "Escopo: `importacoes:read`. Filtre `acao=erro` para ver só o que precisa de correção."
      parameters:
        - { name: acao, in: query, schema: { type: string, enum: [criar, atualizar, ignorar, erro] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de linhas (`linha`, `acao`, `mensagem`, `resultado`, `resultado_msg`, `registro_id`)
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/Erro" }
  /importacoes/{id}/executar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Confirma e inicia a gravação (em segundo plano)
      description: "Escopo: `importacoes:write`. Responde 202; acompanhe em `GET /importacoes/{id}`. Só uma importação roda por vez no ambiente (409 com Retry-After)."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: Iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Importacao" }
        "409": { $ref: "#/components/responses/Erro" }
  /importacoes/{id}/descartar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Descarta uma importação que ainda aguarda confirmação
      description: "Escopo: `importacoes:write`. Nada foi gravado, então nada é desfeito."
      responses:
        "200":
          description: Descartada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Importacao" }
        "409": { $ref: "#/components/responses/Erro" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]+$" }
      description: Repete o pedido sem duplicar (válida por 24 horas).
  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: validation_error }
                  message: { type: string }
                  request_id: { type: string }
  schemas:
    Importacao:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tipo: { type: string }
        status: { type: string, enum: [analisada, executando, concluida, interrompida, cancelada, desfeita, erro] }
        origem: { type: string }
        atualizar_existentes: { type: boolean }
        total_linhas: { type: integer }
        previa:
          type: object
          properties:
            criar: { type: integer }
            atualizar: { type: integer }
            ignorar: { type: integer }
            erro: { type: integer }
        andamento:
          type: object
          properties:
            processadas: { type: integer }
            criados: { type: integer }
            atualizados: { type: integer }
            ignorados: { type: integer }
            erros: { type: integer }
            percentual: { type: integer }
        colunas_ignoradas: { type: array, items: { type: string } }
        mensagem: { type: string }
        criado_em: { type: string, format: date-time }
        concluido_em: { type: string, format: date-time, nullable: true }
    Bairro:
      type: object
      properties:
        id: { type: integer, format: int64 }
        cidade_id: { type: integer, format: int64 }
        nome: { type: string }
        categoria: { type: string, enum: [bairro, povoado] }
        classificacao: { type: string, enum: [urbano, rural] }
        status: { type: string, enum: [ativo, extinto] }
        ibge: { type: string }
        zona: { type: string }
        mutirao: { type: boolean }
        producao: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        altitude: { type: number, nullable: true }
        distancia_centro: { type: number, nullable: true }
        id_externo: { type: string, nullable: true }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    Quarteirao:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bairro_id: { type: integer, format: int64 }
        nome: { type: string }
        ativo: { type: boolean }
        id_externo: { type: string, nullable: true }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    Local:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tipo: { type: string, enum: [residencial, comercio, terreno_baldio, ponto_estrategico, outro] }
        cep: { type: string }
        endereco: { type: string }
        numero: { type: string }
        referencia: { type: string }
        bairro_id: { type: integer, format: int64 }
        quarteirao_id: { type: integer, format: int64 }
        lado: { type: string }
        sequencia: { type: integer, nullable: true }
        complemento: { type: integer, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        ativo: { type: boolean }
        chave_qr: { type: string, description: "Chave lida do QR Code do imóvel." }
