name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: uysiarbo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:@localhost:5432/uysiarbo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatação (gofmt)
        run: |
          sujos=$(gofmt -l cmd internal migrations web)
          if [ -n "$sujos" ]; then echo "Arquivos sem gofmt:"; echo "$sujos"; exit 1; fi

      - name: Telas e queries geradas em dia (templ e sqlc)
        run: |
          go tool templ generate
          go tool sqlc generate
          git diff --exit-code -- web/views internal/db/sqlc

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Testes
        run: go test -count=1 -timeout 30m ./...

  build:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Binário único para a VPS (Linux amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o bin/uysiarbo-linux-amd64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: uysiarbo-linux-amd64
          path: bin/uysiarbo-linux-amd64
